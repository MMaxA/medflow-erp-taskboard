services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medflow
      POSTGRES_USER: medflow
      POSTGRES_PASSWORD: medflow_demo_password
    volumes: [medflow_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U medflow -d medflow"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://medflow:medflow_demo_password@db:5432/medflow
      SECRET_KEY: ${SECRET_KEY:-local-demo-secret-change-before-any-shared-deployment-2026}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  medflow_db:
